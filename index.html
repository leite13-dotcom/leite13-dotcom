<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Radar Mercado Livre</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 40px 20px;
        }

        .box {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,.12);
        }

        h1 {
            margin-top: 0;
        }

        .ok {
            color: #16803c;
            font-weight: bold;
        }

        .erro {
            color: #c62828;
            font-weight: bold;
        }

        .campo {
            margin-top: 25px;
        }

        .label {
            font-weight: bold;
            margin-bottom: 8px;
        }

        pre {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 8px;
            white-space: pre-wrap;
            word-break: break-all;
        }

        button {
            margin-top: 10px;
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #3483fa;
            color: white;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Radar Mercado Livre</h1>

    <p id="status">Verificando retorno da autorização...</p>

    <div id="conteudo"></div>

</div>

<script>

const params = new URLSearchParams(
    window.location.search
);

const code = params.get("code");
const state = params.get("state");
const error = params.get("error");
const description = params.get("error_description");

const status = document.getElementById("status");
const conteudo = document.getElementById("conteudo");

function mostrarCampo(titulo, valor, id) {

    const bloco = document.createElement("div");

    bloco.className = "campo";

    bloco.innerHTML = `
        <div class="label">${titulo}</div>
        <pre id="${id}">${valor || ""}</pre>
        <button onclick="copiar('${id}')">Copiar</button>
    `;

    conteudo.appendChild(bloco);
}

function copiar(id) {

    const texto =
        document.getElementById(id).textContent;

    navigator.clipboard.writeText(texto);

    alert("Copiado.");
}

if (error) {

    status.className = "erro";

    status.textContent =
        "O Mercado Livre retornou um erro.";

    mostrarCampo(
        "Erro",
        error,
        "campoErro"
    );

    if (description) {

        mostrarCampo(
            "Descrição",
            description,
            "campoDescricao"
        );

    }

} else if (code) {

    status.className = "ok";

    status.textContent =
        "Código de autorização recebido com sucesso.";

    mostrarCampo(
        "CODE",
        code,
        "campoCode"
    );

    mostrarCampo(
        "STATE",
        state,
        "campoState"
    );

} else {

    status.textContent =
        "Nenhum código de autorização foi recebido.";

}

</script>

</body>
</html>
